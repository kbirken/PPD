name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # publish the test report as a check run
  pull-requests: write   # let the report action comment on PRs

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Only needed to run Gradle itself. The JBR that runs the MPS ant scripts
      # is downloaded by the build (downloadJbr task).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Downloads MPS and iets3.opensource, builds all languages and runs the MPS
      # tests of test.org.itemis.phydev (see build script org.itemis.phydev.test).
      - name: Build and run tests
        run: ./gradlew buildAndRunTests --console=plain

      # The ant launchtests task writes the JUnit XML files to build/scripts.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'build/scripts/TEST-*.xml'
          check_name: MPS test report
          detailed_summary: true
          include_passed: true
          require_tests: true
          fail_on_failure: true

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: |
            build/junitreport
            build/scripts/TEST-*.xml
          if-no-files-found: warn

      - name: Upload language artifacts
        uses: actions/upload-artifact@v4
        with:
          name: org.itemis.phydev
          path: build/artifacts
          if-no-files-found: warn
